name: ci

# Vérifications sans réseau ni secret : type-check du Worker, tests unitaires du
# détecteur de veille, garde anti-dérive de la documentation, comportement du JS client
# de la page publique, ordre de laws.config.json (invariant 1) et reconstructibilité
# d'une D1 vierge.
#
# Les tests Python du PARSEUR (test_ccq_fr, test_corpus) téléchargent les EPUB : ils
# tournent en local, pas ici. Mais test_config.py, lui, ne fait AUCUN appel réseau — il
# lit laws.config.json sur disque. Il était exclu par ricochet, ce qui laissait
# l'invariant le plus destructeur du dépôt sans aucun garde : une PR qui réordonne
# laws.config.json décalait toutes les plages d'id et passait la CI au vert.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx wrangler types # génère worker-configuration.d.ts (pas d'auth requise)
      - run: npx tsc --noEmit
      - run: node --test scripts/check-consolidation.test.mjs
      - run: node --test tests/catalogue.test.mjs # garde anti-dérive de la documentation (R10)
      - run: node --test tests/page-client.test.mjs # comportement du JS client de la page

      # INVARIANT 1 : l'ordre de laws.config.json porte les plages d'id. Le réordonner
      # fait écraser les articles d'autres lois à la prochaine ingestion, EN SILENCE.
      # test_config.py (test_ordre_fige, test_plages_id_disjointes) ne fait aucun appel
      # réseau : il a sa place ici, contrairement aux tests du parseur.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # beautifulsoup4 seulement : test_config n'en a pas besoin lui-même, mais il importe
      # pipeline.ingest pour _id_base, et ingest importe le parseur. lxml est OPTIONNEL
      # (BeautifulSoup retombe sur html.parser), donc écarté ici — rien ne parse en CI.
      - run: pip install "beautifulsoup4>=4.13"
      - run: python -m unittest pipeline.tests.test_config -v

      # Reconstructibilité : schema.sql décrit l'ÉTAT INITIAL, les migrations s'appliquent
      # PAR-DESSUS. Sans ce garde, un DROP COLUMN sans garde dans une migration casse le
      # bootstrap d'une base neuve sans que rien ne le signale — c'est arrivé avec 0002,
      # découvert seulement à l'audit. Le harnais d'éval ne teste que contre une base déjà
      # peuplée ; ceci est le seul contrôle qui parte du vide. Local, sans réseau ni secret.
      - name: Bootstrap d'une D1 vierge (schema.sql + migrations)
        run: |
          set -euo pipefail
          T=$(mktemp -d)
          npx wrangler d1 execute qclaw --local --persist-to "$T" --file=./schema.sql -y
          npx wrangler d1 migrations apply qclaw --local --persist-to "$T"
          for t in search_log division_links concept_gazetteer article_headnotes; do
            npx wrangler d1 execute qclaw --local --persist-to "$T" --json \
              --command "SELECT COUNT(*) AS n FROM pragma_table_info('$t')" \
              | grep -q '"n": *[1-9]' || { echo "$t absente après migrations"; exit 1; }
          done
          # Le drapeau validated est la frontière entre du contenu proposé par un modèle et
          # du droit relu par un avocat. Une colonne perdue ou renommée le ferait tomber en
          # silence : les requêtes filtrent dessus, elles ne le déclarent pas.
          for t in division_links concept_gazetteer article_headnotes; do
            npx wrangler d1 execute qclaw --local --persist-to "$T" --json \
              --command "SELECT COUNT(*) AS n FROM pragma_table_info('$t') WHERE name='validated'" \
              | grep -q '"n": *1' || { echo "$t sans colonne validated"; exit 1; }
          done
          rm -rf "$T"
